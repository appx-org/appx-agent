#
# Repo-wide CI: lint/format (biome), typecheck, build, and tests for every
# workspace. The contract-specific gates live in contract.yml; the heavy
# nested-podman infra smoke lives in container-smoke.yml (nightly/manual).
#
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # changesets bumps package.json versions but never touches the lockfile,
      # and `npm ci` does NOT fail on the resulting drift (workspace packages
      # are symlinks, not registry fetches — it installs happily and only the
      # unsatisfied workspace link bites later, mid-publish). So check the
      # lockfile explicitly: refreshing it must be a no-op.
      - name: Lockfile is in sync with the manifests
        run: |
          npm install --package-lock-only --no-audit --no-fund
          if ! git diff --exit-code -- package-lock.json; then
            echo "::error::package-lock.json is stale. Run 'npm install --package-lock-only' and commit it."
            exit 1
          fi

      - name: Biome (format + lint, no writes)
        run: npm run check:ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

      - name: Test all workspaces
        run: npm test
