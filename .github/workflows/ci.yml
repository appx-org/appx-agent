#
# Repo-wide CI: lint/format (biome), typecheck, build, tests, and the two
# freshness gates over generated/derived files. One job, so a PR shows a single
# check. The heavy nested-podman infra smoke lives in container-smoke.yml
# (nightly/manual) and never runs here.
#
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # changesets bumps package.json versions but never touches the lockfile,
      # and `npm ci` does NOT fail on the resulting drift (workspace packages
      # are symlinks, not registry fetches — it installs happily and only the
      # unsatisfied workspace link bites later, mid-publish). So check the
      # lockfile explicitly: refreshing it must be a no-op.
      - name: Lockfile is in sync with the manifests
        run: |
          npm install --package-lock-only --no-audit --no-fund
          if ! git diff --exit-code -- package-lock.json; then
            echo "::error::package-lock.json is stale. Run 'npm install --package-lock-only' and commit it."
            exit 1
          fi

      # Each published package needs LICENSE + NOTICE in its own directory: npm
      # only auto-includes them from the package root, not the repo root, so the
      # tarballs would otherwise claim MIT without shipping its text. They are
      # copies of the root files and must not drift.
      - name: LICENSE and NOTICE copies match the root
        run: |
          status=0
          for pkg in packages/*/; do
            for file in LICENSE NOTICE; do
              if ! cmp -s "$file" "$pkg$file"; then
                echo "::error::$pkg$file differs from ./$file. Run 'npm run sync:legal'."
                status=1
              fi
            done
          done
          exit $status

      # The committed contract must be a faithful regeneration of its sources
      # (agent-server's zod schemas + pi's types). Guards against "bumped pi or
      # edited a route but forgot to regenerate", and against a release bumping
      # agent-protocol's version without refreshing openapi.json's info.version.
      # gen:contract runs the pipeline in dependency order: typia event schema →
      # OpenAPI dump that merges it → openapi-typescript.
      - name: Contract artifacts are fresh
        run: |
          npm run gen:contract
          if ! git diff --exit-code -- packages/agent-protocol; then
            echo "::error::Contract artifacts are stale. Run 'npm run gen:contract' and commit the result."
            exit 1
          fi

      - name: Biome (format + lint, no writes)
        run: npm run check:ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

      - name: Test all workspaces
        run: npm test
