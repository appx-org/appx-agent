#
# Release via changesets: when changeset files land on main, this opens (or
# updates) a "Version Packages" PR; when that PR merges, it publishes
# @appx-org/agent-protocol and @appx-org/agent-client to GitHub Packages.
# agent-server is private: true — changesets versions it (so the docker image
# can be tagged from its package.json) but never publishes it to npm.
#
name: release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

# The changesets bot commits the version bump. Local git hooks are a
# developer-workstation convenience (format, typecheck, regenerate the
# contract) and must not run against a bot commit in CI — the equivalent
# checks already run as their own jobs in ci.yml / contract.yml.
env:
  HUSKY: 0

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci

      - name: Build publishable packages
        run: npm run build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          # `changeset version` only rewrites package.json files and changelogs,
          # but two committed artifacts derive from those versions: the lockfile
          # (which records each workspace package's version) and openapi.json
          # (whose info.version IS agent-protocol's version). Left stale, the
          # first breaks the build mid-publish and the second ships a contract
          # that misreports its own version — both happened on 0.1.1. The
          # changeset:version script refreshes them in the same commit, so the
          # release PR arrives already passing the ci.yml + contract.yml gates.
          version: npm run changeset:version
          publish: npx changeset publish
        env:
          # RELEASE_TOKEN is a fine-grained PAT owned by the appx-org org and
          # scoped to THIS REPO ONLY, with exactly two repository permissions
          # (grant these and nothing else when it expires and you regenerate it):
          #   Contents      → read & write  (push the changeset-release/main branch)
          #   Pull requests → read & write  (open + update the Version Packages PR)
          # Deliberately NOT granted: packages (the default GITHUB_TOKEN below
          # publishes), and anything resembling PR approval.
          #
          # It exists for ONE reason: the
          # org forbids GitHub Actions from creating pull requests, and that
          # policy can't be overridden by the `permissions:` block above (which
          # does otherwise work — the default GITHUB_TOKEN pushes the release
          # branch and publishes to the registry just fine). A PAT acts as a
          # user rather than as Actions, so it can open the PR. Nothing here
          # grants PR *approval* rights, so branch review can't be self-served.
          #
          # Falls back to GITHUB_TOKEN when the secret is absent: version-mode
          # then still commits and pushes changeset-release/main, and only the
          # final "open a PR" API call fails — so a missing secret degrades to
          # "open the PR by hand", not to a broken release.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Registry auth stays on the default token — `packages: write` above
          # is sufficient to publish, and scoping this narrowly means the PAT
          # never needs package permissions.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
